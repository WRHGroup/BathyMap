<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BathyMap</title>
<meta name="description" content="Map and downloads of raw bathymetry survey data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1 id="site-title">BathyMap</h1>
    <p id="site-summary" class="summary">Loading survey lines…</p>
  </div>
  <nav class="actions" aria-label="Site actions">
    <a id="download-all" class="button" href="#" hidden download>Download all lines (CSV)</a>
    <a id="repo-link" class="button ghost" href="#" target="_blank" rel="noopener" hidden>Data repository</a>
    <button id="panel-toggle" class="button ghost panel-toggle" type="button" aria-controls="panel" aria-expanded="false">Lines</button>
  </nav>
</header>

<main class="app">
  <aside id="panel" class="panel" aria-label="Survey lines">
    <section id="detail" class="detail" hidden aria-live="polite"></section>

    <div class="list-head">
      <label class="eyebrow" for="line-filter">Survey lines</label>
      <input id="line-filter" type="search" placeholder="Filter by line, date, area or platform" autocomplete="off">
    </div>
    <div id="line-list" class="line-list">
      <p class="note">Loading…</p>
    </div>

    <section class="about">
      <h2 class="eyebrow">About this data</h2>
      <p id="site-description"></p>
      <dl class="refs">
        <dt>Depth</dt><dd id="depth-reference">as logged by the instrument</dd>
        <dt>Times</dt><dd id="time-reference">as logged by the instrument</dd>
        <dt>Coordinates</dt><dd>WGS 84 latitude and longitude, decimal degrees in the CSV files</dd>
        <dt id="licence-label" hidden>Licence</dt><dd id="licence" hidden></dd>
        <dt id="contact-label" hidden>Contact</dt><dd id="contact" hidden></dd>
      </dl>
      <p id="generated" class="note"></p>
    </section>
  </aside>

  <div class="map-wrap">
    <div id="map" role="application" aria-label="Map of survey lines"></div>
    <div id="probe" class="probe" hidden></div>
    <div id="select-bar" class="select-bar" hidden aria-live="polite"></div>
    <div id="legend" class="legend" aria-label="Depth colour scale">
      <div class="legend-title">Depth (m)</div>
      <canvas id="legend-ramp" width="240" height="12"></canvas>
      <div id="legend-ticks" class="legend-ticks"></div>
      <div id="legend-hint" class="legend-hint">Zoom in to see soundings</div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
